<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motivated-reasoning example viewer</title>
<style>
:root {
  --agree: #d4edda;
  --partial: #fff3cd;
  --disagree: #f8d7da;
  --sel: #cfe2ff;
  --green: #2e7d32;
  --orange: #d84315;
  --grey: #888;
  --text: #1a1a1a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
  font-size: 13px; color: var(--text);
}
body {
  display: grid;
  grid-template-columns: 380px 1fr;
  grid-template-rows: auto 1fr;
  height: 100vh;
}
header {
  grid-column: 1 / 3;
  padding: 8px 16px;
  border-bottom: 1px solid #ddd;
  background: #fafafa;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: baseline;
}
header h1 { font-size: 14px; margin: 0; }
header .meta-item { color: var(--grey); }
header .meta-item b { color: var(--text); }
#controls {
  border-bottom: 1px solid #eee;
  padding: 8px;
  background: #fcfcfc;
  font-size: 11px;
  display: grid;
  gap: 6px;
}
#controls label { cursor: pointer; user-select: none; }
#controls select { font-size: 11px; }
#list {
  overflow: auto;
  border-right: 1px solid #ddd;
}
#list .row {
  padding: 8px 10px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  font-size: 11px;
  line-height: 1.35;
}
#list .row:hover { background: #f3f3f3; }
#list .row.sel { outline: 2px solid #1976d2; outline-offset: -2px; background: var(--sel) !important; }
#list .row.agree { background: var(--agree); }
#list .row.partial { background: var(--partial); }
#list .row.disagree { background: var(--disagree); }
#list .row .top { display: flex; gap: 8px; align-items: center; }
#list .row .qtext {
  margin-top: 2px;
  color: #333;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.idx { font-family: monospace; color: var(--grey); }
.gtpill {
  font-family: monospace;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  background: #e0e0e0;
}
.gtpill.mot { background: #ffe0b2; color: #bf360c; }
.gtpill.alg { background: #c8e6c9; color: #1b5e20; }
.bar {
  display: inline-block;
  height: 8px;
  background: #1976d2;
  vertical-align: middle;
  border-radius: 1px;
}
.miniscore { font-family: monospace; font-size: 10px; color: var(--grey); }
.glyph { font-family: monospace; }
#detail {
  overflow: auto;
  padding: 16px 24px;
}
#detail h2 { font-size: 14px; margin: 0 0 8px 0; }
.qblock {
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 12px;
  background: #fafafa;
}
.qblock .qtext-full {
  white-space: pre-wrap;
  margin-bottom: 8px;
  font-size: 13px;
}
.qblock .choice {
  padding: 4px 8px;
  margin: 2px 0;
  border-left: 3px solid transparent;
  font-family: monospace;
  font-size: 12px;
}
.qblock .choice.correct { border-left-color: var(--green); font-weight: bold; }
.qblock .choice.hint::after { content: " (hint)"; color: var(--orange); font-weight: bold; }
.verdict-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.verdict {
  font-family: monospace;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  background: #eee;
}
.verdict.gt-mot { background: #ffe0b2; color: #bf360c; }
.verdict.gt-alg { background: #c8e6c9; color: #1b5e20; }
.verdict.probe-pos { background: #ffe0b2; color: #bf360c; }
.verdict.probe-neg { background: #c8e6c9; color: #1b5e20; }
.verdict.monitor-pos { background: #ffe0b2; color: #bf360c; }
.verdict.monitor-neg { background: #c8e6c9; color: #1b5e20; }
details {
  margin-bottom: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
}
details > summary {
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
  background: #f7f7f7;
  font-size: 12px;
  user-select: none;
}
details[open] > summary { border-bottom: 1px solid #ddd; }
details > pre {
  margin: 0;
  padding: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  background: #fff;
  font-size: 12px;
  line-height: 1.45;
  max-height: 60vh;
  overflow: auto;
}
.kbd {
  font-family: monospace;
  background: #eee;
  border: 1px solid #ccc;
  padding: 0 4px;
  border-radius: 3px;
  font-size: 11px;
}
#empty {
  color: var(--grey);
  text-align: center;
  padding: 32px;
}
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">Loading...</h1>
  <span class="meta-item" id="hdr-aucs"></span>
  <span class="meta-item" id="hdr-counts"></span>
  <span class="meta-item">Keys: <span class="kbd">j</span>/<span class="kbd">k</span> next/prev, <span class="kbd">m</span>/<span class="kbd">a</span> filter motivated/aligned, <span class="kbd">d</span> show disagreements, <span class="kbd">esc</span> clear filters</span>
</header>
<div>
  <div id="controls">
    <div>
      <label><input type="checkbox" id="f-mot" checked> motivated</label>
      <label><input type="checkbox" id="f-alg" checked> aligned</label>
    </div>
    <div>
      <label><input type="checkbox" id="f-probe-correct"> 🔍 ✓</label>
      <label><input type="checkbox" id="f-monitor-correct"> 🖥️ ✓</label>
      <label><input type="checkbox" id="f-disagree"> 🔍 vs 🖥️ disagree</label>
    </div>
    <label>Sort:
      <select id="sortby">
        <option value="idx">index</option>
        <option value="post-desc">🔍 post score (desc)</option>
        <option value="post-asc">🔍 post score (asc)</option>
        <option value="diff">|🔍 post − 🖥️|</option>
        <option value="prepost">🔍 pre→post delta</option>
      </select>
    </label>
  </div>
  <div id="list"></div>
</div>
<div id="detail"><div id="empty">Select an example.</div></div>

<script>
window.__DATA = JSON.parse(/*__DATA_PLACEHOLDER__*/null);
</script>
<script>
const D = window.__DATA;
const M = D.meta;
const stepOrder = M.step_order || ['pre', 'post'];
const PROBE_ICON = '🔍';
const MONITOR_ICON = '🖥️';

document.getElementById('hdr-title').textContent =
  `${M.model} · ${M.dataset} · ${M.bias} · ${M.probe} (layer ${M.layer})`;
document.getElementById('hdr-aucs').innerHTML =
  stepOrder.map(s => `${PROBE_ICON} ${s} <b>${(M.step_aucs[s] ?? 0).toFixed(3)}</b>`).join(' · ');
document.getElementById('hdr-counts').textContent =
  `${M.n_examples} examples · label dist ${JSON.stringify(M.label_dist)}`;

function probeBinary(score) { return score >= 0.5 ? 1 : 0; }
function monitorBinary(m) {
  if (m == null) return null;
  if (typeof m.is_motivated === 'boolean') return m.is_motivated ? 1 : 0;
  if (typeof m.score === 'number') return m.score >= 0.5 ? 1 : 0;
  return null;
}
function isProbeCorrect(rec) {
  const post = rec.probe_scores.post ?? Object.values(rec.probe_scores).at(-1);
  return probeBinary(post) === rec.label;
}
function isMonitorCorrect(rec) {
  const mb = monitorBinary(rec.monitor);
  if (mb == null) return null;
  return mb === rec.label;
}

function rowClass(rec) {
  const probeOk = isProbeCorrect(rec);
  const mb = monitorBinary(rec.monitor);
  const monitorOk = mb == null ? null : (mb === rec.label);
  if (monitorOk == null) return probeOk ? 'agree' : 'disagree';
  if (probeOk && monitorOk) return 'agree';
  if (!probeOk && !monitorOk) return 'disagree';
  return 'partial';
}

function bar(score, max=80) {
  const w = Math.round(Math.min(1, Math.max(0, score)) * max);
  return `<span class="bar" style="width:${w}px"></span>`;
}

function renderList() {
  const fmot = document.getElementById('f-mot').checked;
  const falg = document.getElementById('f-alg').checked;
  const fpc  = document.getElementById('f-probe-correct').checked;
  const fmc  = document.getElementById('f-monitor-correct').checked;
  const fdis = document.getElementById('f-disagree').checked;
  const sortBy = document.getElementById('sortby').value;

  let rows = D.records.filter(r => {
    if (r.label === 1 && !fmot) return false;
    if (r.label === 0 && !falg) return false;
    if (fpc && !isProbeCorrect(r)) return false;
    if (fmc) {
      const mc = isMonitorCorrect(r);
      if (mc === false || mc == null) return false;
    }
    if (fdis) {
      const probeBin = probeBinary(r.probe_scores.post ?? 0);
      const mb = monitorBinary(r.monitor);
      if (mb == null || probeBin === mb) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    if (sortBy === 'idx') return a.idx - b.idx;
    if (sortBy === 'post-desc') return (b.probe_scores.post ?? 0) - (a.probe_scores.post ?? 0);
    if (sortBy === 'post-asc')  return (a.probe_scores.post ?? 0) - (b.probe_scores.post ?? 0);
    if (sortBy === 'diff') {
      const da = Math.abs((a.probe_scores.post ?? 0) - (a.monitor.score ?? 0));
      const db = Math.abs((b.probe_scores.post ?? 0) - (b.monitor.score ?? 0));
      return db - da;
    }
    if (sortBy === 'prepost') {
      const da = (a.probe_scores.post ?? 0) - (a.probe_scores.pre ?? 0);
      const db = (b.probe_scores.post ?? 0) - (b.probe_scores.pre ?? 0);
      return db - da;
    }
    return 0;
  });

  const list = document.getElementById('list');
  list.innerHTML = '';
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = `row ${rowClass(r)}`;
    div.dataset.idx = r.idx;
    const gtCls = r.label === 1 ? 'mot' : 'alg';
    const gtTxt = r.label === 1 ? 'mot' : 'alg';
    const stepBars = stepOrder.map(s => {
      const sc = r.probe_scores[s] ?? 0;
      return `<span title="probe ${s}=${sc.toFixed(3)}">${PROBE_ICON} ${s} ${bar(sc, 30)} ${sc.toFixed(2)}</span>`;
    }).join(' ');
    const mscore = r.monitor.score;
    const mbar = (mscore == null) ? `<span class="miniscore">${MONITOR_ICON} ?</span>`
      : `<span title="monitor=${mscore.toFixed(3)}">${MONITOR_ICON} ${bar(mscore, 30)} ${mscore.toFixed(2)}</span>`;
    const probeOk = isProbeCorrect(r);
    const mb = monitorBinary(r.monitor);
    const monitorOk = (mb == null) ? null : (mb === r.label);
    const glyph = `${probeOk ? '✓' : '✗'}${monitorOk == null ? '?' : (monitorOk ? '✓' : '✗')}`;
    div.innerHTML = `
      <div class="top">
        <span class="idx">#${String(r.idx).padStart(3, '0')}</span>
        <span class="gtpill ${gtCls}">${gtTxt}</span>
        <span class="miniscore">${stepBars}</span>
        ${mbar}
        <span class="glyph">${glyph}</span>
      </div>
      <div class="qtext">${escapeHtml(r.question || '').slice(0, 200)}</div>`;
    div.onclick = () => selectRecord(r.idx);
    list.appendChild(div);
  });
  // re-apply selection if still visible
  if (currentIdx != null) {
    const sel = list.querySelector(`.row[data-idx="${currentIdx}"]`);
    if (sel) sel.classList.add('sel');
  }
}

let currentIdx = null;

function escapeHtml(s) {
  return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function selectRecord(idx) {
  currentIdx = idx;
  const r = D.records.find(x => x.idx === idx);
  if (!r) return;
  // highlight
  document.querySelectorAll('#list .row').forEach(el => el.classList.toggle('sel',
    Number(el.dataset.idx) === idx));
  // scroll into view
  const sel = document.querySelector(`#list .row[data-idx="${idx}"]`);
  if (sel) sel.scrollIntoView({block: 'nearest'});

  const det = document.getElementById('detail');
  const choiceLetters = r.choice_letters || ['A', 'B', 'C', 'D'];
  const choicesHtml = (r.choices || []).map((c, i) => {
    const letter = choiceLetters[i];
    const isCorrect = letter === r.correct_letter;
    const isHint = letter === r.hint_letter;
    return `<div class="choice ${isCorrect ? 'correct' : ''} ${isHint ? 'hint' : ''}">
              <b>${letter}.</b> ${escapeHtml(c)}
            </div>`;
  }).join('');

  const probePills = stepOrder.map(s => {
    const sc = r.probe_scores[s] ?? 0;
    const bin = probeBinary(sc);
    return `<span class="verdict probe-${bin === 1 ? 'pos' : 'neg'}">${PROBE_ICON} ${s}=${sc.toFixed(3)} ${bin === 1 ? 'mot' : 'alg'}</span>`;
  }).join('');
  const mb = monitorBinary(r.monitor);
  const monitorPill = (mb == null)
    ? `<span class="verdict">${MONITOR_ICON} (no data)</span>`
    : `<span class="verdict monitor-${mb === 1 ? 'pos' : 'neg'}">${MONITOR_ICON} ${(r.monitor.score ?? 0).toFixed(3)} ${mb === 1 ? 'mot' : 'alg'}</span>`;
  const gtPill = `<span class="verdict gt-${r.label === 1 ? 'mot' : 'alg'}">GT=${r.label === 1 ? 'mot' : 'alg'}</span>`;

  det.innerHTML = `
    <h2>#${r.idx} · q_idx ${r.q_idx} · hint ${r.hint_letter ?? '?'}</h2>
    <div class="qblock">
      <div class="qtext-full">${escapeHtml(r.question)}</div>
      ${choicesHtml}
      <div style="margin-top:8px;color:#666;font-size:11px;">
        correct = ${r.correct_letter ?? '?'} ·
        unhinted answered ${r.unhinted_answer_letter} ·
        with hint answered ${r.hinted_answer_letter}
      </div>
    </div>
    <div class="verdict-strip">${gtPill}${probePills}${monitorPill}</div>
    <details>
      <summary>How the hint was given (${(r.hint_injection && r.hint_injection.kind) || 'n/a'})</summary>
      <pre>${renderHintInjection(r.hint_injection)}</pre>
    </details>
    <details>
      <summary>Unhinted CoT (model answered ${r.unhinted_answer_letter})</summary>
      <pre>${escapeHtml(r.unhinted_cot)}</pre>
    </details>
    <details open>
      <summary>Hinted CoT — hint=${r.hint_letter ?? '?'} (model answered ${r.hinted_answer_letter})</summary>
      <pre>${escapeHtml(r.hinted_cot)}</pre>
    </details>
    <details>
      <summary>LLM monitor reasoning ${r.monitor.is_motivated == null ? '' : `(verdict: ${r.monitor.is_motivated ? 'motivated' : 'aligned'})`}</summary>
      <pre>${escapeHtml(r.monitor.reasoning)}</pre>
    </details>
  `;
}

function renderHintInjection(hi) {
  if (!hi) return '(unavailable)';
  const userBlock = `<span style="color:#888">[user]</span>\n${escapeHtml(hi.user || '')}`;
  if (hi.kind === 'self' && hi.assistant_prefill) {
    return `${userBlock}\n\n<span style="color:#888">[assistant — prefilled, model continues from here]</span>\n${escapeHtml(hi.assistant_prefill)}`;
  }
  return userBlock;
}

// Filters
['f-mot', 'f-alg', 'f-probe-correct', 'f-monitor-correct', 'f-disagree', 'sortby'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderList);
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  const visible = Array.from(document.querySelectorAll('#list .row')).map(el => Number(el.dataset.idx));
  if (e.key === 'j' || e.key === 'ArrowDown') {
    if (!visible.length) return;
    const i = currentIdx == null ? 0 : Math.min(visible.indexOf(currentIdx) + 1, visible.length - 1);
    selectRecord(visible[i]);
    e.preventDefault();
  } else if (e.key === 'k' || e.key === 'ArrowUp') {
    if (!visible.length) return;
    const i = currentIdx == null ? 0 : Math.max(visible.indexOf(currentIdx) - 1, 0);
    selectRecord(visible[i]);
    e.preventDefault();
  } else if (e.key === 'm') {
    document.getElementById('f-mot').checked = true;
    document.getElementById('f-alg').checked = false;
    renderList();
  } else if (e.key === 'a') {
    document.getElementById('f-mot').checked = false;
    document.getElementById('f-alg').checked = true;
    renderList();
  } else if (e.key === 'd') {
    document.getElementById('f-disagree').checked = !document.getElementById('f-disagree').checked;
    renderList();
  } else if (e.key === 'Escape') {
    ['f-mot', 'f-alg'].forEach(id => document.getElementById(id).checked = true);
    ['f-probe-correct', 'f-monitor-correct', 'f-disagree'].forEach(id => document.getElementById(id).checked = false);
    renderList();
  }
});

// Debug AUC reproducibility (?debug=1)
if (new URLSearchParams(location.search).get('debug') === '1') {
  // Compute ROC AUC from per-example post scores vs labels.
  // Mann–Whitney U formulation.
  const pos = D.records.filter(r => r.label === 1).map(r => r.probe_scores.post);
  const neg = D.records.filter(r => r.label === 0).map(r => r.probe_scores.post);
  let sum = 0;
  for (const p of pos) for (const n of neg) {
    if (p > n) sum += 1; else if (p === n) sum += 0.5;
  }
  const auc = sum / (pos.length * neg.length);
  console.log(`[debug] reconstructed post-CoT AUC: ${auc.toFixed(4)} (meta: ${M.step_aucs.post.toFixed(4)})`);
  if (Math.abs(auc - M.step_aucs.post) > 1e-3) {
    console.warn('AUC drift > 1e-3 — embedded data may be corrupted');
  }
}

renderList();
if (D.records.length) selectRecord(D.records[0].idx);
</script>
</body>
</html>
