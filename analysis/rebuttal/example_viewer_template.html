<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motivated-reasoning example viewer</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #fafafa;
  --surface-2: #f4f4f5;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #18181b;
  --muted: #71717a;
  --primary: #2563eb;
  --primary-bg: #eff6ff;
  --primary-border: #bfdbfe;
  --success: #16a34a;
  --success-bg: #dcfce7;
  --warning: #d97706;
  --warning-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  /* domain colors: motivated = warm amber, aligned = green */
  --mot-fg: #b45309;
  --mot-bg: #fef3c7;
  --mot-bg-subtle: #fffbeb;
  --alg-fg: #15803d;
  --alg-bg: #dcfce7;
  --alg-bg-subtle: #f0fdf4;
  --grey: var(--muted);
  --green: var(--success);
  --orange: var(--warning);
  --sel: var(--primary-bg);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body {
  display: grid;
  grid-template-columns: 380px 1fr;
  grid-template-rows: auto 1fr;
  height: 100vh;
}
header {
  grid-column: 1 / 3;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: baseline;
}
header h1 {
  font-size: 13px;
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.01em;
}
header .meta-item { color: var(--muted); font-size: 12px; }
header .meta-item b { color: var(--text); font-weight: 600; }

#controls {
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  background: var(--surface);
  font-size: 11px;
  display: grid;
  gap: 8px;
}
#controls label {
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-right: 10px;
  color: var(--text);
}
#controls input[type="checkbox"] { accent-color: var(--primary); }
#controls select {
  font: inherit;
  padding: 3px 8px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
}

#sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
#sidebar > #controls { flex: 0 0 auto; }
#list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--bg);
}
#list .row {
  position: relative;
  padding: 10px 12px 10px 14px;
  border-bottom: 1px solid var(--surface-2);
  cursor: pointer;
  font-size: 11px;
  line-height: 1.4;
  transition: background-color 80ms ease;
}
#list .row:hover { background: var(--surface); }
#list .row.sel {
  background: var(--sel) !important;
}
#list .row.sel::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--primary);
}
/* Subtle status accent on right edge instead of garish background */
#list .row.agree::after,
#list .row.partial::after,
#list .row.disagree::after {
  content: '';
  position: absolute;
  right: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 2px;
}
#list .row.agree::after    { background: var(--success); }
#list .row.partial::after  { background: var(--warning); }
#list .row.disagree::after { background: var(--danger); }
#list .row .top {
  display: flex;
  gap: 8px;
  align-items: center;
}
#list .row .qtext {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.idx {
  font-family: var(--mono);
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.gtpill {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.gtpill.mot { background: var(--mot-bg); color: var(--mot-fg); }
.gtpill.alg { background: var(--alg-bg); color: var(--alg-fg); }
.bar {
  display: inline-block;
  height: 6px;
  background: var(--primary);
  vertical-align: middle;
  border-radius: 999px;
  opacity: 0.85;
}
.miniscore {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.glyph {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

#detail {
  overflow: auto;
  padding: 20px 28px 28px 28px;
  background: var(--bg);
}
#detail h2 {
  font-size: 14px;
  margin: 0 0 14px 0;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.qblock {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 14px;
  background: var(--surface);
}
.qblock .qtext-full {
  white-space: pre-wrap;
  margin-bottom: 10px;
  font-size: 13.5px;
  line-height: 1.55;
}
.qblock .choice {
  padding: 5px 10px;
  margin: 2px 0;
  border-left: 3px solid transparent;
  font-family: var(--mono);
  font-size: 12px;
  border-radius: 0 4px 4px 0;
}
.qblock .choice.correct {
  border-left-color: var(--success);
  font-weight: 600;
  background: var(--alg-bg-subtle);
}
.qblock .choice.hint::after {
  content: ' (hint)';
  color: var(--warning);
  font-weight: 600;
}

.verdict-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  align-items: center;
}
.verdict {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.verdict.gt-mot, .verdict.probe-pos, .verdict.monitor-pos {
  background: var(--mot-bg);
  border-color: var(--mot-bg);
  color: var(--mot-fg);
}
.verdict.gt-alg, .verdict.probe-neg, .verdict.monitor-neg {
  background: var(--alg-bg);
  border-color: var(--alg-bg);
  color: var(--alg-fg);
}

details {
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}
details > summary {
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 600;
  background: var(--surface);
  font-size: 12px;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: '▸';
  color: var(--muted);
  display: inline-block;
  width: 10px;
  font-size: 10px;
  transition: transform 120ms ease;
}
details[open] > summary::before { transform: rotate(90deg); }
details[open] > summary { border-bottom: 1px solid var(--border); }
details > pre {
  margin: 0;
  padding: 14px 16px;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--bg);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  max-height: 60vh;
  overflow: auto;
  color: var(--text);
}
.kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  color: var(--text);
}
#empty {
  color: var(--muted);
  text-align: center;
  padding: 48px;
  font-size: 13px;
}

/* Print/PDF: each example starts on its own page; long CoTs flow as needed.
   The on-screen viewer (header / sidebar / detail) is hidden in print. */
#print-only { display: none; }
#btn-print {
  margin-left: auto;
  font: inherit;
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
}
#btn-print:hover { background: var(--surface); }

@media print {
  @page { size: letter; margin: 0.5in; }
  html, body {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
    background: white;
  }
  header, #sidebar, #detail { display: none !important; }
  #print-only { display: block !important; }
  .print-record {
    page-break-before: always;
    break-before: page;
    padding: 0;
  }
  .print-record:first-child {
    page-break-before: auto;
    break-before: auto;
  }
  .print-record h2 { margin-top: 0; }
  /* Allow CoT blocks to overflow paginate cleanly */
  details, details > pre {
    max-height: none !important;
    overflow: visible !important;
    page-break-inside: auto;
  }
  /* Avoid orphaning a summary at the bottom of a page */
  details > summary { page-break-after: avoid; }
  /* Hide the chevron in print since all <details> are forced open */
  details > summary::before { display: none; }
  /* Soft shadows / hovers off in print */
  .verdict, .qblock, details {
    box-shadow: none !important;
  }
}

/* Subtle scrollbars (WebKit) */
#list::-webkit-scrollbar, #detail::-webkit-scrollbar,
details > pre::-webkit-scrollbar { width: 10px; height: 10px; }
#list::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb,
details > pre::-webkit-scrollbar-thumb {
  background: var(--surface-2);
  border-radius: 999px;
  border: 2px solid var(--bg);
}
#list::-webkit-scrollbar-thumb:hover, #detail::-webkit-scrollbar-thumb:hover {
  background: var(--border-strong);
}
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">Loading...</h1>
  <span class="meta-item" id="hdr-aucs"></span>
  <span class="meta-item" id="hdr-counts"></span>
  <span class="meta-item">Keys: <span class="kbd">j</span>/<span class="kbd">k</span> next/prev, <span class="kbd">m</span>/<span class="kbd">a</span> filter motivated/aligned, <span class="kbd">d</span> show disagreements, <span class="kbd">esc</span> clear filters</span>
  <button id="btn-print" type="button" title="Render every example as one-per-page and open the print dialog">🖨️ Print all</button>
</header>
<div id="sidebar">
  <div id="controls">
    <div>
      <label><input type="checkbox" id="f-mot" checked> motivated</label>
      <label><input type="checkbox" id="f-alg" checked> aligned</label>
    </div>
    <div>
      <label><input type="checkbox" id="f-probe-correct"> 🔍 ✓</label>
      <label><input type="checkbox" id="f-monitor-correct"> 🖥️ ✓</label>
      <label><input type="checkbox" id="f-disagree"> 🔍 vs 🖥️ disagree</label>
    </div>
    <label>Sort:
      <select id="sortby">
        <option value="idx">index</option>
        <option value="post-desc">🔍 post score (desc)</option>
        <option value="post-asc">🔍 post score (asc)</option>
        <option value="diff">|🔍 post − 🖥️|</option>
        <option value="prepost">🔍 pre→post delta</option>
      </select>
    </label>
  </div>
  <div id="list"></div>
</div>
<div id="detail"><div id="empty">Select an example.</div></div>
<div id="print-only" data-rendered="0"></div>

<script>
window.__DATA = JSON.parse(/*__DATA_PLACEHOLDER__*/null);
</script>
<script>
const D = window.__DATA;
const M = D.meta;
const stepOrder = M.step_order || ['pre', 'post'];
const PROBE_ICON = '🔍';
const MONITOR_ICON = '🖥️';

document.getElementById('hdr-title').textContent =
  `${M.model} · ${M.dataset} · ${M.bias} · ${M.probe} (layer ${M.layer})`;
document.getElementById('hdr-aucs').innerHTML =
  stepOrder.map(s => `${PROBE_ICON} ${s} <b>${(M.step_aucs[s] ?? 0).toFixed(3)}</b>`).join(' · ');
document.getElementById('hdr-counts').textContent =
  `${M.n_examples} examples · label dist ${JSON.stringify(M.label_dist)}`;

function probeBinary(score) { return score >= 0.5 ? 1 : 0; }
function monitorBinary(m) {
  if (m == null) return null;
  if (typeof m.is_motivated === 'boolean') return m.is_motivated ? 1 : 0;
  if (typeof m.score === 'number') return m.score >= 0.5 ? 1 : 0;
  return null;
}
function isProbeCorrect(rec) {
  const post = rec.probe_scores.post ?? Object.values(rec.probe_scores).at(-1);
  return probeBinary(post) === rec.label;
}
function isMonitorCorrect(rec) {
  const mb = monitorBinary(rec.monitor);
  if (mb == null) return null;
  return mb === rec.label;
}

function rowClass(rec) {
  const probeOk = isProbeCorrect(rec);
  const mb = monitorBinary(rec.monitor);
  const monitorOk = mb == null ? null : (mb === rec.label);
  if (monitorOk == null) return probeOk ? 'agree' : 'disagree';
  if (probeOk && monitorOk) return 'agree';
  if (!probeOk && !monitorOk) return 'disagree';
  return 'partial';
}

function bar(score, max=80) {
  const w = Math.round(Math.min(1, Math.max(0, score)) * max);
  return `<span class="bar" style="width:${w}px"></span>`;
}

function renderList() {
  const fmot = document.getElementById('f-mot').checked;
  const falg = document.getElementById('f-alg').checked;
  const fpc  = document.getElementById('f-probe-correct').checked;
  const fmc  = document.getElementById('f-monitor-correct').checked;
  const fdis = document.getElementById('f-disagree').checked;
  const sortBy = document.getElementById('sortby').value;

  let rows = D.records.filter(r => {
    if (r.label === 1 && !fmot) return false;
    if (r.label === 0 && !falg) return false;
    if (fpc && !isProbeCorrect(r)) return false;
    if (fmc) {
      const mc = isMonitorCorrect(r);
      if (mc === false || mc == null) return false;
    }
    if (fdis) {
      const probeBin = probeBinary(r.probe_scores.post ?? 0);
      const mb = monitorBinary(r.monitor);
      if (mb == null || probeBin === mb) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    if (sortBy === 'idx') return a.idx - b.idx;
    if (sortBy === 'post-desc') return (b.probe_scores.post ?? 0) - (a.probe_scores.post ?? 0);
    if (sortBy === 'post-asc')  return (a.probe_scores.post ?? 0) - (b.probe_scores.post ?? 0);
    if (sortBy === 'diff') {
      const da = Math.abs((a.probe_scores.post ?? 0) - (a.monitor.score ?? 0));
      const db = Math.abs((b.probe_scores.post ?? 0) - (b.monitor.score ?? 0));
      return db - da;
    }
    if (sortBy === 'prepost') {
      const da = (a.probe_scores.post ?? 0) - (a.probe_scores.pre ?? 0);
      const db = (b.probe_scores.post ?? 0) - (b.probe_scores.pre ?? 0);
      return db - da;
    }
    return 0;
  });

  const list = document.getElementById('list');
  list.innerHTML = '';
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = `row ${rowClass(r)}`;
    div.dataset.idx = r.idx;
    const gtCls = r.label === 1 ? 'mot' : 'alg';
    const gtTxt = r.label === 1 ? 'motivated' : 'aligned';
    const stepBars = stepOrder.map(s => {
      const sc = r.probe_scores[s] ?? 0;
      return `<span title="probe ${s}=${sc.toFixed(3)}">${PROBE_ICON} ${s} ${bar(sc, 30)} ${sc.toFixed(2)}</span>`;
    }).join(' ');
    const mscore = r.monitor.score;
    const mbar = (mscore == null) ? `<span class="miniscore">${MONITOR_ICON} ?</span>`
      : `<span title="monitor=${mscore.toFixed(3)}">${MONITOR_ICON} ${bar(mscore, 30)} ${mscore.toFixed(2)}</span>`;
    const probeOk = isProbeCorrect(r);
    const mb = monitorBinary(r.monitor);
    const monitorOk = (mb == null) ? null : (mb === r.label);
    const glyph = `${probeOk ? '✓' : '✗'}${monitorOk == null ? '?' : (monitorOk ? '✓' : '✗')}`;
    div.innerHTML = `
      <div class="top">
        <span class="idx">#${String(r.idx).padStart(3, '0')}</span>
        <span class="gtpill ${gtCls}">${gtTxt}</span>
        <span class="miniscore">${stepBars}</span>
        ${mbar}
        <span class="glyph">${glyph}</span>
      </div>
      <div class="qtext">${escapeHtml(r.question || '').slice(0, 200)}</div>`;
    div.onclick = () => selectRecord(r.idx);
    list.appendChild(div);
  });
  // re-apply selection if still visible
  if (currentIdx != null) {
    const sel = list.querySelector(`.row[data-idx="${currentIdx}"]`);
    if (sel) sel.classList.add('sel');
  }
}

let currentIdx = null;

function escapeHtml(s) {
  return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function selectRecord(idx) {
  currentIdx = idx;
  const r = D.records.find(x => x.idx === idx);
  if (!r) return;
  // highlight
  document.querySelectorAll('#list .row').forEach(el => el.classList.toggle('sel',
    Number(el.dataset.idx) === idx));
  // scroll into view
  const sel = document.querySelector(`#list .row[data-idx="${idx}"]`);
  if (sel) sel.scrollIntoView({block: 'nearest'});

  const det = document.getElementById('detail');
  const choiceLetters = r.choice_letters || ['A', 'B', 'C', 'D'];
  const choicesHtml = (r.choices || []).map((c, i) => {
    const letter = choiceLetters[i];
    const isCorrect = letter === r.correct_letter;
    const isHint = letter === r.hint_letter;
    return `<div class="choice ${isCorrect ? 'correct' : ''} ${isHint ? 'hint' : ''}">
              <b>${letter}.</b> ${escapeHtml(c)}
            </div>`;
  }).join('');

  const probePills = stepOrder.map(s => {
    const sc = r.probe_scores[s] ?? 0;
    const bin = probeBinary(sc);
    return `<span class="verdict probe-${bin === 1 ? 'pos' : 'neg'}">${PROBE_ICON} ${s}=${sc.toFixed(3)} ${bin === 1 ? 'motivated' : 'aligned'}</span>`;
  }).join('');
  const mb = monitorBinary(r.monitor);
  const monitorPill = (mb == null)
    ? `<span class="verdict">${MONITOR_ICON} (no data)</span>`
    : `<span class="verdict monitor-${mb === 1 ? 'pos' : 'neg'}">${MONITOR_ICON} ${(r.monitor.score ?? 0).toFixed(3)} ${mb === 1 ? 'motivated' : 'aligned'}</span>`;
  const gtPill = `<span class="verdict gt-${r.label === 1 ? 'mot' : 'alg'}">GT=${r.label === 1 ? 'motivated' : 'aligned'}</span>`;

  det.innerHTML = recordDetailHtml(r, {openAll: false,
    choicesHtml, gtPill, probePills, monitorPill});
}

function recordDetailHtml(r, opts) {
  const choicesHtml = opts.choicesHtml ?? buildChoicesHtml(r);
  const gtPill = opts.gtPill ?? buildGtPill(r);
  const probePills = opts.probePills ?? buildProbePills(r);
  const monitorPill = opts.monitorPill ?? buildMonitorPill(r);
  const openAttr = opts.openAll ? ' open' : '';
  return `
    <h2>#${r.idx} · q_idx ${r.q_idx} · hint ${r.hint_letter ?? '?'}</h2>
    <div class="qblock">
      <div class="qtext-full">${escapeHtml(r.question)}</div>
      ${choicesHtml}
      <div style="margin-top:8px;color:#666;font-size:11px;">
        correct = ${r.correct_letter ?? '?'} ·
        unhinted answered ${r.unhinted_answer_letter} ·
        with hint answered ${r.hinted_answer_letter}
      </div>
    </div>
    <div class="verdict-strip">${gtPill}${probePills}${monitorPill}</div>
    <details${openAttr}>
      <summary>How the hint was given (${(r.hint_injection && r.hint_injection.kind) || 'n/a'})</summary>
      <pre>${renderHintInjection(r.hint_injection)}</pre>
    </details>
    <details${openAttr}>
      <summary>Unhinted CoT (model answered ${r.unhinted_answer_letter})</summary>
      <pre>${escapeHtml(r.unhinted_cot)}</pre>
    </details>
    <details${opts.openAll ? ' open' : ' open'}>
      <summary>Hinted CoT — hint=${r.hint_letter ?? '?'} (model answered ${r.hinted_answer_letter})</summary>
      <pre>${escapeHtml(r.hinted_cot)}</pre>
    </details>
    <details${openAttr}>
      <summary>LLM monitor reasoning ${r.monitor.is_motivated == null ? '' : `(verdict: ${r.monitor.is_motivated ? 'motivated' : 'aligned'})`}</summary>
      <pre>${escapeHtml(r.monitor.reasoning)}</pre>
    </details>
  `;
}

function buildChoicesHtml(r) {
  const choiceLetters = r.choice_letters || ['A', 'B', 'C', 'D'];
  return (r.choices || []).map((c, i) => {
    const letter = choiceLetters[i];
    const isCorrect = letter === r.correct_letter;
    const isHint = letter === r.hint_letter;
    return `<div class="choice ${isCorrect ? 'correct' : ''} ${isHint ? 'hint' : ''}">
              <b>${letter}.</b> ${escapeHtml(c)}
            </div>`;
  }).join('');
}
function buildGtPill(r) {
  return `<span class="verdict gt-${r.label === 1 ? 'mot' : 'alg'}">GT=${r.label === 1 ? 'motivated' : 'aligned'}</span>`;
}
function buildProbePills(r) {
  return stepOrder.map(s => {
    const sc = r.probe_scores[s] ?? 0;
    const bin = probeBinary(sc);
    return `<span class="verdict probe-${bin === 1 ? 'pos' : 'neg'}">${PROBE_ICON} ${s}=${sc.toFixed(3)} ${bin === 1 ? 'motivated' : 'aligned'}</span>`;
  }).join('');
}
function buildMonitorPill(r) {
  const mb = monitorBinary(r.monitor);
  return (mb == null)
    ? `<span class="verdict">${MONITOR_ICON} (no data)</span>`
    : `<span class="verdict monitor-${mb === 1 ? 'pos' : 'neg'}">${MONITOR_ICON} ${(r.monitor.score ?? 0).toFixed(3)} ${mb === 1 ? 'motivated' : 'aligned'}</span>`;
}

// Pre-render every record for printing. Lazy: only on first print request.
function ensurePrintRendered() {
  const root = document.getElementById('print-only');
  if (!root || root.dataset.rendered === '1') return;
  const html = D.records.map(r =>
    `<div class="print-record">${recordDetailHtml(r, {openAll: true})}</div>`
  ).join('');
  root.innerHTML = html;
  root.dataset.rendered = '1';
}
window.addEventListener('beforeprint', ensurePrintRendered);
const btnPrint = document.getElementById('btn-print');
if (btnPrint) btnPrint.addEventListener('click', () => { ensurePrintRendered(); window.print(); });

function renderHintInjection(hi) {
  if (!hi) return '(unavailable)';
  const userBlock = `<span style="color:#888">[user]</span>\n${escapeHtml(hi.user || '')}`;
  if (hi.kind === 'self' && hi.assistant_prefill) {
    return `${userBlock}\n\n<span style="color:#888">[assistant — prefilled, model continues from here]</span>\n${escapeHtml(hi.assistant_prefill)}`;
  }
  return userBlock;
}

// Filters
['f-mot', 'f-alg', 'f-probe-correct', 'f-monitor-correct', 'f-disagree', 'sortby'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderList);
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  const visible = Array.from(document.querySelectorAll('#list .row')).map(el => Number(el.dataset.idx));
  if (e.key === 'j' || e.key === 'ArrowDown') {
    if (!visible.length) return;
    const i = currentIdx == null ? 0 : Math.min(visible.indexOf(currentIdx) + 1, visible.length - 1);
    selectRecord(visible[i]);
    e.preventDefault();
  } else if (e.key === 'k' || e.key === 'ArrowUp') {
    if (!visible.length) return;
    const i = currentIdx == null ? 0 : Math.max(visible.indexOf(currentIdx) - 1, 0);
    selectRecord(visible[i]);
    e.preventDefault();
  } else if (e.key === 'm') {
    document.getElementById('f-mot').checked = true;
    document.getElementById('f-alg').checked = false;
    renderList();
  } else if (e.key === 'a') {
    document.getElementById('f-mot').checked = false;
    document.getElementById('f-alg').checked = true;
    renderList();
  } else if (e.key === 'd') {
    document.getElementById('f-disagree').checked = !document.getElementById('f-disagree').checked;
    renderList();
  } else if (e.key === 'Escape') {
    ['f-mot', 'f-alg'].forEach(id => document.getElementById(id).checked = true);
    ['f-probe-correct', 'f-monitor-correct', 'f-disagree'].forEach(id => document.getElementById(id).checked = false);
    renderList();
  }
});

// Debug AUC reproducibility (?debug=1)
if (new URLSearchParams(location.search).get('debug') === '1') {
  // Compute ROC AUC from per-example post scores vs labels.
  // Mann–Whitney U formulation.
  const pos = D.records.filter(r => r.label === 1).map(r => r.probe_scores.post);
  const neg = D.records.filter(r => r.label === 0).map(r => r.probe_scores.post);
  let sum = 0;
  for (const p of pos) for (const n of neg) {
    if (p > n) sum += 1; else if (p === n) sum += 0.5;
  }
  const auc = sum / (pos.length * neg.length);
  console.log(`[debug] reconstructed post-CoT AUC: ${auc.toFixed(4)} (meta: ${M.step_aucs.post.toFixed(4)})`);
  if (Math.abs(auc - M.step_aucs.post) > 1e-3) {
    console.warn('AUC drift > 1e-3 — embedded data may be corrupted');
  }
}

renderList();
if (D.records.length) selectRecord(D.records[0].idx);
</script>
